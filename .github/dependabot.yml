version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 把零散的小版本更新併成一個 PR，避免每週被十幾個 PR 淹沒
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 5
    # Dependabot 預設的訊息（Bump xxx from 1.0 to 1.1）不符合 Conventional Commits，
    # 會被 commitlint 擋下。加上 prefix 後會變成 chore(deps): bump ...
    # include: scope 讓 devDependencies 的更新自動帶 deps-dev scope，一眼能分辨。
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # 改的是 .github/workflows/，用 ci 這個 type 比 chore 精確
    commit-message:
      prefix: ci
      include: scope
