# AI code review —— 只留言，不阻擋。
#
# ## 為什麼刻意獨立成一個檔案
#
# 這是會被大量 fork 的樣板。獨立成一個檔案的話，不想要這個功能的專案刪掉這一個檔案
# 就乾淨移除了，不必去 ci.yml 裡面挑。
#
# 代價是它與 ci.yml 的 quality job 平行跑，而不是「確定性檢查過了才花錢」。
# 若你的團隊在意這點，把下面的 job 搬進 ci.yml 並加上 `needs: quality` 即可。
#
# ## 改到這個檔案的 PR 不會被 review
#
# action 會比對這個 workflow 檔與預設分支上的版本，內容不一致就拒絕執行
# （log 裡是 "Skipping action due to workflow validation"）。這是它自己的安全機制：
# 否則 PR 作者只要在 PR 裡改掉下面的 prompt，就能指示 reviewer 放水。
#
# 所以改這個檔案的 PR 得靠人看，合併之後才會生效。第一次把這個檔案加進專案時也一樣，
# 那次 PR 不會有 AI review。這種情況下 action 以 exit 0 結束，
# 下面那個偵測失敗的步驟不會觸發 —— 但 action 自己會在 run summary 留一條 warning。
#
# ## 為什麼不是 required check
#
# LLM 的輸出是非確定性的。把它設成必要檢查，第一次誤判卡住 merge 就會有人去關掉它，
# 整套機制就報廢了。確定性的把關交給 ci.yml 與 scripts/check-conventions.mjs，
# 這裡只負責提出判斷題上的意見。

name: AI Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 同一個 PR 有新 commit 時取消還在跑的舊 review，與 ci.yml 一致
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    name: AI 審查
    # 草稿 PR 還在改，不浪費額度；貼上 skip-ai-review label 可以單獨關掉某個 PR
    if: >-
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ai-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # review 要算 merge-base 才知道這次改動的範圍
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        id: review
        # 關鍵：即使 token 過期或 action 本身掛掉，這個 check 也不會變紅去卡住 merge。
        # AI review 是建議，不是 gate。
        continue-on-error: true
        with:
          # 需要兩件事，缺一不可：
          #   1. Claude Code GitHub App 裝在這個 repo（在 Claude Code 裡執行
          #      /install-github-app，或裝 https://github.com/apps/claude）
          #   2. 這個 secret（claude setup-token 產生後 gh secret set）
          # 只設 secret 而沒裝 App 的話，action 會拿到 401 而什麼都不做。
          #
          # ⚠️ 這個 token 會過期。不想輪替的話改用 anthropic_api_key，
          # 只是費用改成按量計費。
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 用單一則留言持續更新進度，不會每次 push 都在 PR 上洗出一堆新留言
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            這個 PR 的分支已經 checkout 在工作目錄。請照以下步驟 review：

            1. 先完整讀 .github/AI_REVIEW.md。那是本專案的審查準則，包含嚴重度分級、
               檢查清單，以及一份「不要報什麼」的清單。那份清單的優先級高於你自己的判斷，
               請嚴格遵守。
            2. 用 `gh pr diff --name-only` 先看動了哪些檔案，再**逐檔**用
               `gh pr diff -- <檔案>` 取內容。不要一次抓整份 diff —— 稍大的 PR
               就會超過單次輸出上限而被截斷，而截斷發生在你看到內容之前，
               你不會知道自己漏看了什麼。程式碼優先於文件。
            3. 需要理解上下文時去讀相關檔案（例如改了 composable 就去看呼叫它的頁面）。
               規則本體在 docs/CONTRIBUTING.md。
            4. 把 Blocker 與 Major 的發現用 inline comment 留在對應的行，
               格式照 .github/AI_REVIEW.md 的「輸出格式」。
            5. 最後用一則 summary 收尾：這次改動在做什麼、整體風險、
               以及你刻意沒有報的面向。
            6. 沒有 Blocker 也沒有 Major 時，就明確說「沒有發現阻擋性問題」並列出
               你檢查過的面向。不要為了有東西可寫而湊 Minor。
            7. 不要修改任何檔案、不要 commit、不要 push。你只是 reviewer。
          claude_args: |
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Read,Grep,Glob"

      # continue-on-error 讓失敗變成綠燈，代價是「設定壞掉」會完全無聲 ——
      # 不會有人發現 AI 其實已經好幾週沒在 review 了。
      # 這一步把它變回看得見的 annotation，但仍然不讓 check 變紅。
      - name: 設定有問題時明確說出來
        if: steps.review.outcome == 'failure'
        run: |
          echo "::warning::AI review 沒有執行完成，這次 PR 沒有 AI 的意見。常見原因：(1) Claude Code GitHub App 沒裝在這個 repo —— 在 Claude Code 裡執行 /install-github-app；(2) CLAUDE_CODE_OAUTH_TOKEN 過期 —— 用 claude setup-token 重新產生。實際原因見上一步的 log。"
# ── 安全性上刻意的取捨 ──────────────────────────────────────────────────
#
# 1. 用 pull_request 而不是 pull_request_target。
#    代價：來自 fork 的 PR 拿不到 secret，這個 job 會直接跳過（不會失敗）。
#    好處：外部貢獻者的程式碼永遠碰不到你的 token。
#    對一個公開樣板來說這是唯一安全的選擇 —— 不要為了讓 fork PR 也能 review
#    而改成 pull_request_target，那等於把 token 交到 PR 作者手上。
#
# 2. --allowedTools 是白名單，只有讀取與留言的能力。
#    沒有 Edit / Write / Bash(pnpm:*)，所以 PR 的內容無法誘導它改檔案，
#    也無法執行 PR 控制的 package script。
#
# 3. permissions 沒有開 contents: write。它不需要寫入 repo。
